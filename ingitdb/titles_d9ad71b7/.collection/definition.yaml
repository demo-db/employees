record_file:
  name: records.json
  format: json
  type: "map[$record_id]map[$field_name]any"
primary_key: ["emp_no","title","from_date"]
columns:
  "emp_no":
    type: int
    required: true
  "title":
    type: string
    required: true
  "from_date":
    type: string
    required: true
  "to_date":
    type: string
