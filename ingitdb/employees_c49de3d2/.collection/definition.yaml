record_file:
  name: records.json
  format: json
  type: "map[$record_id]map[$field_name]any"
primary_key: ["emp_no"]
columns:
  "emp_no":
    type: int
    required: true
  "birth_date":
    type: string
    required: true
  "first_name":
    type: string
    required: true
  "last_name":
    type: string
    required: true
  "gender":
    type: string
    required: true
  "hire_date":
    type: string
    required: true
