    constraint_validation: provider-preflight-passed
    relationship_comparison: provider-native
    fields:
        - name: emp_no
          type: int
          nullable: false
        - name: birth_date
          type: string
          nullable: false
        - name: first_name
          type: string
          nullable: false
        - name: last_name
          type: string
          nullable: false
        - name: gender
          type: string
          nullable: false
        - name: hire_date
          type: string
