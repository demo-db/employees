name: Validate Employees browser edition

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Download and verify every pinned upstream source file
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 scripts/fetch-source.py --destination "$RUNNER_TEMP/employees-upstream"

      - name: Test the source converter and selected browser edition
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/rebuild-source.py --source-dir "$RUNNER_TEMP/employees-upstream" --check

      - name: Install the immutable shared provider generator
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          base="https://raw.githubusercontent.com/demo-db/websites/a5126d30dfa00d2e8bc20560e75e205ddc334704"
          curl --fail --silent --show-error --location "$base/scripts/provider-tools/generate.py" -o "$RUNNER_TEMP/generate-provider.py"
          printf '%s  %s\n' 'cc010c7e15aea5c1e56c5068796e34b56cc5340766e4f6f1217f3be64dd31780' "$RUNNER_TEMP/generate-provider.py" | sha256sum --check
          curl --fail --silent --show-error --location "$base/schemas/ovdb-database-draft-1.schema.json" -o "$RUNNER_TEMP/ovdb-database-draft-1.schema.json"
          printf '%s  %s\n' '4af5dc5f48bce1bc2ba5cb6664dd2c28adcadd818c74da0e78fe428f6f6ec55b' "$RUNNER_TEMP/ovdb-database-draft-1.schema.json" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/provider-generator/scripts/provider-tools" "$RUNNER_TEMP/provider-generator/schemas"
          cp "$RUNNER_TEMP/generate-provider.py" "$RUNNER_TEMP/provider-generator/scripts/provider-tools/generate.py"
          cp "$RUNNER_TEMP/ovdb-database-draft-1.schema.json" "$RUNNER_TEMP/provider-generator/schemas/ovdb-database-draft-1.schema.json"

      - name: Generate provider contracts and exports
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 "$RUNNER_TEMP/provider-generator/scripts/provider-tools/generate.py" --root .

      - name: Assert all tables and views are represented truthfully
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path("metadata/schema.json").read_text(encoding="utf-8"))
          tables = [item for item in schema["tables"] if item["kind"] == "table"]
          views = [item for item in schema["tables"] if item["kind"] == "view"]
          if len(tables) != 6 or len(views) != 2:
              raise SystemExit(f"expected six tables and two native views, got {len(tables)} and {len(views)}")
          if sum(item["rowCount"] for item in tables) != 13584:
              raise SystemExit("selected physical table row count differs from the reviewed browser edition")
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          descriptor = json.loads(Path("ovdb-database.json").read_text(encoding="utf-8"))
          capabilities = manifest["capabilities"]["ovdb"]
          generator = manifest["generator"]["ovdb"]
          if capabilities["available"] is not True or capabilities["readOnly"] is not True or capabilities["query"] is not True or capabilities["deploymentVerified"] is not True:
              raise SystemExit("OVDB must be declared available only for its verified read-only query mount")
          if generator["query"] is not capabilities["query"]:
              raise SystemExit("generator OVDB query capability differs from website capabilities")
          if descriptor["capabilities"] != {"read": True, "query": True, "write": False}:
              raise SystemExit("public descriptor must advertise verified read/query and disabled writes")
          PY

      - name: Install pinned ModelSpec and MeaningGraph tools
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/employees-tools"
          curl --fail --silent --show-error --location 'https://github.com/modelspec-org/cli/releases/download/v0.2.0/modelspec_0.2.0_linux_amd64.tar.gz' -o "$RUNNER_TEMP/modelspec.tar.gz"
          printf '%s  %s\n' '95b999570c633a4eba07014dccaf31dc71cfc9e9e7711c3cc254cb377bc2ddbc' "$RUNNER_TEMP/modelspec.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/modelspec.tar.gz" -C "$RUNNER_TEMP/employees-tools" modelspec
          curl --fail --silent --show-error --location 'https://github.com/meaninggraph/cli/releases/download/v0.3.0/meaninggraph_0.3.0_linux_amd64.tar.gz' -o "$RUNNER_TEMP/meaninggraph.tar.gz"
          printf '%s  %s\n' 'f8073b9ab5547551e00d021fcd83c4ff52c4a49034f9ee5719512dfade9afdf8' "$RUNNER_TEMP/meaninggraph.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/meaninggraph.tar.gz" -C "$RUNNER_TEMP/employees-tools" meaninggraph

      - name: Validate the published ModelSpec and HCL export
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/employees-tools/modelspec" lint --profile publish model
          "$RUNNER_TEMP/employees-tools/modelspec" export --check model/employees.modelspec.hcl model/employees.modelspec.json

      - name: Validate the pinned MeaningGraph and embedded schema
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          core="$(python3 -c 'import json; print(json.load(open("manifest.json"))["generator"]["meaning"]["core"]["revision"])')"
          core_dir="$RUNNER_TEMP/meaninggraph-core"
          git init -q "$core_dir"
          git -C "$core_dir" fetch --quiet --depth=1 'https://github.com/meaninggraph/core.git' "$core"
          git -C "$core_dir" checkout -q --detach "$core"
          cmp <("$RUNNER_TEMP/employees-tools/meaninggraph" schema) "$core_dir/meaning.schema.json"
          "$RUNNER_TEMP/employees-tools/meaninggraph" check model "$core_dir" --address github.com/demo-db/employees=model --graph "github.com/meaninggraph/core=$core_dir"

      - name: Publication front matter opts into both descriptors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          content = Path("OVDB.md").read_text(encoding="utf-8")
          expected = "---\novdb: 1\npublish:\n  - ./ovdb.yaml\n  - ./ovdb-database.json\n---\n"
          if not content.startswith(expected):
              raise SystemExit("OVDB.md must opt in to both ovdb.yaml and ovdb-database.json")
          PY

      - name: Generated files are committed and current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::source, provider metadata, or generated artifacts are stale"
            exit 1
          fi
